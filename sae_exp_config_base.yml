# backbone settings
backbone: vit #vit_mae
num_heads: 12
pretrained_vit_IN1K: false
total_vit_epochs: 300
vit_size: 768 #3072

#sae setting
batch_size: 4096
circuits: true
eval_split: test 
expansion_coef: 5
k: 32
l1_lambda: 0.0
l2_lambda: 0.05
lr: 0.005
sae_epochs: 150
sae_type: batch_top_k_sae
tied: false

#main experiment settings
ref_epoch: 299
ref_layer: 11
fixed_sae: false
tag: _cls_only #tag for the folder in case of not standard training ["cls_only", "cls_only_tr"]
test_patches: false
train_saes: false 
train_split: train
trained_on: cls #"mix, cls, patches, None"
want_images: true
finetune_sae: false
combined: true
layer_nrs:
- 0
- 12
vit_epochs:
- 0
- 300

#plotting settings
combined_images: true
track_feature: false
track_feature_id: 0
concept_types: false
only_plots: false 
probing: false

#global experiment settings
cache_activations: false
run_seed_base: 12345
sae_runs: 1
skip_existing: true
verbose_every: 50

#paths
checkpoint_folder: sae_checkpoints
plots_dir: figs/sae_similarity
results_dir: eval_results
vit_checkpoint_dir: ../openood/OpenOOD/results/vit_tiny_ffcv
activation_root:
data_dir: /gpfs/space/projects/mlgroup/data/images_largescale/ #/tmp/imagenet_1k/
imglist_path: /gpfs/space/projects/mlgroup/data/benchmark_imglist/imagenet/test_imagenet.txt #train_imagenet.txt
log_path: #can be left empty

#dataset settings
img_size: 224
ind_name: imagenet #imagenet_mixed10_balanced #imagenet20
keywords:
- train
- test
norm: true
num_classes: 1000
seed: _s8
step: 0

#similarity metrics
topk_ranking: cls #what token to use for topk images ranking cls or patch
align_compute_chance: false
align_compute_stability: false
align_method: spearman
align_min_sim: 0.05
align_summary_key: mean_matched
topk_act_threshold: 0.0
topk_k: 50
topk_metric: jaccard
topk_summary_key: mean_best
topk_threshold: null

